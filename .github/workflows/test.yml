name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # The version is printed in four places and was hand-copied into three of
      # them; they had drifted three versions apart before this check existed.
      - name: Versions agree with package.json
        run: npm run check:versions
