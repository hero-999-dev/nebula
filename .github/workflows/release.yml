name: Release

# Pushing a v* tag (npm run push) builds Windows + macOS and publishes one
# GitHub Release. Installed copies of Nebula read latest.yml from that release,
# so the release must NOT be a draft.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build renderer + main
        run: npm run build

      # Drives the real Electron app on throwaway profiles. Catches the class of
      # bug jsdom cannot see: the preload bridge, the main process, the vault.
      - name: Electron smoke test
        run: npm run smoke

      - name: Package installer + portable
        run: npx electron-builder --win nsis portable --publish never

      - name: Assert the update manifest exists
        shell: bash
        run: |
          # Without latest.yml no installed app can ever see this release.
          # Fail here rather than shipping a release nobody can update from.
          test -f release/latest.yml || { echo "release/latest.yml missing"; ls -la release; exit 1; }
          cat release/latest.yml

      - name: Assert electron-updater is inside the asar
        shell: bash
        run: |
          # If vite bundles electron-updater instead of leaving it external,
          # the app still builds and silently never checks for updates.
          npx asar list release/win-unpacked/resources/app.asar > asar.txt
          # asar prints Windows separators on a Windows runner, POSIX ones elsewhere.
          grep -qE 'node_modules[\\/]electron-updater' asar.txt || { echo "electron-updater not packaged"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            release/Nebula-Setup-*.exe
            release/Nebula-portable-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # electron-builder only packages what vite already emitted; without this
      # it fails with 'entry file "dist-electron/main.js" does not exist'.
      - name: Build renderer + main
        run: npm run build

      - name: Unit regressions on macOS
        run: npm test

      - name: Build universal DMG + ZIP
        run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          # No Apple Developer certificate: the build is unsigned, which is why
          # macOS gets "notify + download" rather than in-place auto-update.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Assert Mac packages and universal executable
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test -s "release/Nebula-${version}-mac.dmg"
          test -s "release/Nebula-${version}-mac.zip"
          # lipo takes the input file first, then the command.
          lipo "release/mac-universal/Nebula.app/Contents/MacOS/Nebula" -verify_arch arm64 x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*-mac.dmg
            release/*-mac.zip
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Generate user-facing release notes and Mac instructions
        run: node scripts/release-body.js "${{ github.ref_name }}" release-body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nebula ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/**/*
          body_path: release-body.md
