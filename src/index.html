<!DOCTYPE html>
<html lang="en" data-theme="main">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/editor.css" />
</head>
<body>
  <!-- The window's own strip. Electron draws no title bar (titleBarStyle
       'hidden'), so this is it: the logo, then the menus. The native
       minimise / maximise / close sit at the right through titleBarOverlay. -->
  <div class="titlebar" id="titlebar">
    <span class="tb-logo" id="tb-logo" data-icon="logo" aria-hidden="true"></span>
    <nav class="app-menu" id="app-menu" aria-label="Main menu"></nav>
  </div>

  <div id="app">
    <aside class="side" id="side">
      <!-- No mark here: the window's own title bar already shows the icon a few
           pixels above this line, and two of them side by side read as clutter. -->
      <div class="brand">
        <button type="button" class="side-toggle" id="side-toggle" title="Hide the note list" aria-label="Hide the note list" aria-expanded="true"><span data-icon="menu"></span></button>
        <span class="brand-name">Nebula</span>
      </div>
      <input id="side-filter" type="search" placeholder="Filter notes…" aria-label="Filter notes" />
      <!-- Filter by label (0.9.3): opens on a press; the note's own labels and the
           #labels written in the text are two groups. -->
      <button type="button" class="label-filter-btn" id="label-filter-btn" aria-expanded="false" aria-controls="label-filter" title="Filter by label">
        <span data-icon="tag"></span><span class="lf-text">Filter by label</span><span class="lf-clear" title="Clear the label filter" hidden>×</span>
      </button>
      <div class="label-filter" id="label-filter" role="group" aria-label="Filter by label" hidden>
        <input id="label-filter-search" type="search" placeholder="Find a label" aria-label="Find a label" autocomplete="off" />
        <div class="lf-group" data-kind="any"><div class="lf-chips"></div></div>
        <p class="lf-empty">No labels yet</p>
      </div>
      <nav class="note-list" id="note-list" aria-label="Notes"></nav>

      <!-- Per-note menu: pin, archive, delete. One menu, moved to whichever
           row asked for it, rather than one per row. -->
      <div class="note-menu" id="note-menu" hidden>
        <!-- The owner's order (0.9.2): pin, the view mode, labels, archive, trash last. -->
        <button type="button" data-note-act="pin"></button>
        <button type="button" data-note-act="readonly"></button>
        <button type="button" data-note-act="autoorder"></button>
        <button type="button" data-note-act="labels">Edit labels</button>
        <button type="button" data-note-act="folder">Move to folder</button>
        <button type="button" data-note-act="archive"></button>
        <button type="button" data-note-act="trash">Move to trash</button>
      </div>

      <div class="side-foot">
        <!-- One panel, opening UPWARD over the list so the button you pressed
             does not move out from under the pointer, and two buttons side by
             side under it — Archive left, Trash right. -->
        <div class="drawer-body" id="drawer-body" hidden></div>
        <div class="drawer-tabs">
          <button type="button" class="btn drawer-tab" data-drawer="archive" aria-expanded="false">
            Archive<span class="drawer-count" id="archive-count">0</span>
          </button>
          <button type="button" class="btn drawer-tab" data-drawer="trash" aria-expanded="false">
            Trash<span class="drawer-count" id="trash-count">0</span>
          </button>
        </div>
        <!-- New folder (0.9.3) beside it: the folder icon and a plus. -->
        <div class="new-row">
          <button class="btn primary" id="btn-new" type="button">New note</button>
          <button class="btn new-folder" id="btn-new-folder" type="button" title="New folder" aria-label="New folder"><span data-icon="folder"></span><span class="nf-plus" aria-hidden="true">+</span></button>
        </div>
        <div class="theme-pick" id="theme-pick" role="group" aria-label="Theme">
          <button type="button" data-theme="main" title="Main — violet">Main</button>
          <button type="button" data-theme="dark" title="Dark">Dark</button>
          <button type="button" data-theme="light" title="Light">Light</button>
          <button type="button" data-theme="white" title="White — how the note looks on A4">White</button>
        </div>
        <div class="side-meta">
          <span class="app-version" id="app-version" title="About Nebula"></span>
          <!-- Languages (0.9.3): always open, right beside the version, the way the
               owner drew it; each name in its own language. On the rail they
               stand one under another as EN, DE, PL, TR. -->
          <div class="lang-pick" id="lang-pick">
            <div class="lang-pick__row" id="lang-row" role="group" aria-label="Language" data-no-i18n>
              <button type="button" data-lang="en" title="English">English</button>
              <button type="button" data-lang="de" title="Deutsch">Deutsch</button>
              <button type="button" data-lang="pl" title="Polski">Polski</button>
              <button type="button" data-lang="tr" title="Türkçe">Türkçe</button>
            </div>
          </div>
          <button class="btn ghost btn-mini" id="btn-check-updates" type="button" title="Check for updates">Check for updates</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="demo-banner" id="demo-banner" hidden>Browser preview — notes stay in memory only. Use the desktop app for disk storage.</div>
      <header class="page-head">
        <input id="title" class="title-input" placeholder="Untitled" autocomplete="off" spellcheck="true" />
        <button type="button" class="readonly-chip" id="readonly-chip" hidden title="This note is view-only. Click to allow editing.">🔒 Only view</button>
        <button type="button" class="readonly-chip order-chip" id="order-chip" hidden title="Shapes and pictures a page line falls across go to the next page by themselves. Click to turn it off.">Auto order mode is on</button>
        <div id="note-labels" class="note-labels" aria-label="Note labels"></div>
        <span class="savestate" id="savestate"></span>
        <!-- The page (0.9.3): Nebula Wide / Narrow and the paper sizes, boxed like the pad. -->
        <div class="pad page-modes" id="page-modes" role="group" aria-label="Page width"></div>
        <div class="pad" id="pad" role="group" aria-label="Move the editing bar">
          <button type="button" data-pad="top"    title="Editing bar: top"><span data-icon="up"></span></button>
          <button type="button" data-pad="right"  title="Editing bar: right"><span data-icon="right"></span></button>
          <button type="button" data-pad="ai"     title="Toggle AI panel"><span data-icon="ai"></span></button>
          <button type="button" data-pad="bottom" title="Editing bar: bottom"><span data-icon="down"></span></button>
          <button type="button" data-pad="left"   title="Editing bar: left"><span data-icon="left"></span></button>
          <button type="button" data-pad="hide"   title="Hide / show the editing bar"><span data-icon="minus"></span></button>
        </div>
      </header>

      <div class="edit-shell" id="edit-shell">
        <div class="toolbar" id="toolbar">
          <div class="tb-row">
            <button type="button" class="tb" data-act="undo" title="Undo (Ctrl+Z)"><span data-icon="undo"></span></button>
            <button type="button" class="tb" data-act="redo" title="Redo (Ctrl+Y)"><span data-icon="redo"></span></button>
            <span class="tb-sep"></span>
            <select class="tb-select" id="tb-outline" title="Outline format">
              <option value="p">Paragraph</option>
              <option value="h1">Heading 1</option>
              <option value="h2">Heading 2</option>
              <option value="h3">Heading 3</option>
              <option value="blockquote">Quote</option>
            </select>
            <span class="tb-sep"></span>
            <button type="button" class="tb" data-act="ul" title="Bulleted list"><span data-icon="bullets"></span></button>
            <button type="button" class="tb" data-act="ol" title="Numbered list"><span data-icon="numbers"></span></button>
            <button type="button" class="tb" data-act="todo" title="To-do"><span data-icon="todo"></span></button>
            <button type="button" class="tb" data-act="toggle" title="Toggle list"><span data-icon="toggle"></span></button>
            <button type="button" class="tb" data-act="outdent" title="Decrease indent (Shift+Tab)"><span data-icon="outdent"></span></button>
            <button type="button" class="tb" data-act="indent" title="Increase indent (Tab)"><span data-icon="indent"></span></button>
            <span class="tb-sep"></span>
            <button type="button" class="tb" data-act="save" title="Save now (Ctrl+S)"><span data-icon="save"></span></button>
            <button type="button" class="tb" data-act="print" title="Print (Ctrl+P)"><span data-icon="print"></span></button>
            <span class="tb-wrap">
              <button type="button" class="tb" data-menu="menu-export" title="Export this note"><span data-icon="download"></span></button>
              <div class="tb-menu tb-menu--export" id="menu-export" hidden></div>
            </span>
            <button type="button" class="tb" data-act="import" title="Import a note (.md, .html, .docx, .odt, .doc, .rtf or .enex)"><span data-icon="upload"></span></button>
            <button type="button" class="tb" data-act="cut" title="Cut (Ctrl+X)"><span data-icon="cut"></span></button>
            <button type="button" class="tb" data-act="copy" title="Copy (Ctrl+C)"><span data-icon="copy"></span></button>
            <button type="button" class="tb" data-act="paste" title="Paste (Ctrl+V)"><span data-icon="paste"></span></button>
            <span class="tb-sep"></span>
            <span class="tb-wrap">
              <button type="button" class="tb" data-act="shape-rect" title="Insert shape"><span data-icon="shapes"></span></button>
              <button type="button" class="tb tb-caret" data-menu="menu-shapes" title="Shape kind">▾</button>
              <div class="tb-menu tb-menu--shapes" id="menu-shapes" hidden>
                <button type="button" data-shape-add="rect"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1.6" y="4.6" width="14.8" height="8.8" rx="1"/></svg></span><span class="label">Rectangle</span></button>
                <button type="button" data-shape-add="square"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.6" y="3.6" width="10.8" height="10.8" rx="1"/></svg></span><span class="label">Square</span></button>
                <button type="button" data-shape-add="ellipse"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><ellipse cx="9" cy="9" rx="7.4" ry="4.6"/></svg></span><span class="label">Ellipse</span></button>
                <button type="button" data-shape-add="circle"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="9" cy="9" r="5.6"/></svg></span><span class="label">Circle</span></button>
                <button type="button" data-shape-add="diamond"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 2.4 15.6 9 9 15.6 2.4 9Z"/></svg></span><span class="label">Diamond</span></button>
                <button type="button" data-shape-add="triangle"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 2.8 15.8 15.2H2.2Z"/></svg></span><span class="label">Triangle</span></button>
              </div>
            </span>
            <!-- Arrows have their own menu beside the shapes (0.8.5 had them at the end
                 of the shape list, where a label with no icon fell into the icon
                 column and read "S…", "E…", "C…"). -->
            <span class="tb-wrap">
              <button type="button" class="tb" data-arrow-add="straight" title="Insert arrow"><span class="tb-svg" aria-hidden="true"><svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15.5 14.5 3.5"/><path d="M8.5 3.5h6v6"/></svg></span></button>
              <button type="button" class="tb tb-caret" data-menu="menu-arrows" title="Arrow kind">▾</button>
              <div class="tb-menu tb-menu--shapes tb-menu--arrows" id="menu-arrows" hidden>
                <button type="button" data-arrow-add="straight"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15.5 14.5 3.5"/><path d="M8.5 3.5h6v6"/></svg></span><span class="label">Straight arrow</span></button>
                <button type="button" data-arrow-add="elbow"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h7v9h6"/><path d="M12.5 10.5l3 3-3 3"/></svg></span><span class="label">Elbow arrow</span></button>
                <button type="button" data-arrow-add="curve"><span class="sh-mark" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 14.5C3.5 6 9 3.5 15 4.5"/><path d="M11.5 2l3.6 2.6-2.6 3.4"/></svg></span><span class="label">Curved arrow</span></button>
              </div>
            </span>
            <button type="button" class="tb" data-act="codeblock" title="Code block (with language)"><span data-icon="codeblock"></span></button>
            <button type="button" class="tb" data-act="divider" title="Divider"><span data-icon="divider"></span></button>
          </div>

          <div class="tb-row">
            <!-- A real menu, not a <datalist>: a datalist cannot be styled, so
                 every font looked identical in one plain column, and picking
                 one only fired `change` — with a collapsed caret the command
                 had nothing to apply to, so nothing ever changed. The menu is
                 filled by toolbar.js, each row set in its own face. -->
            <span class="tb-wrap">
              <button type="button" class="tb tb-font" id="tb-font" data-menu="menu-font" title="Font">
                <span class="tb-font__name">Font</span><span class="tb-font__caret">▾</span>
              </button>
              <div class="tb-menu tb-menu--font" id="menu-font" hidden></div>
            </span>
            <!-- The field still takes any number typed into it; the caret beside
                 it opens the common sizes. A <datalist> drew no arrow of its own
                 and could not be styled to match the other menus. -->
            <span class="tb-wrap tb-combo">
              <input id="tb-size" class="tb-input tb-input--size" inputmode="numeric" placeholder="Size" title="Size — type any number, or pick one" />
              <button type="button" class="tb tb-caret" data-menu="menu-size" title="Font size">▾</button>
              <div class="tb-menu tb-menu--size" id="menu-size" hidden></div>
            </span>
            <span class="tb-sep"></span>
            <span class="tb-wrap">
              <button type="button" class="tb tb-color" data-act="color" title="Text color (Ctrl+T)"><span class="hl-letter">A</span><i class="tb-bar" id="color-bar"></i></button>
              <button type="button" class="tb tb-caret" data-menu="menu-color" title="Text color">▾</button>
              <div class="tb-menu" id="menu-color" hidden></div>
            </span>
            <span class="tb-wrap">
              <button type="button" class="tb tb-color" data-act="hilite" title="Highlight (Ctrl+H)"><span class="hl-letter">H</span><i class="tb-bar" id="hilite-bar"></i></button>
              <button type="button" class="tb tb-caret" data-menu="menu-hilite" title="Highlight color">▾</button>
              <div class="tb-menu" id="menu-hilite" hidden></div>
            </span>
            <span class="tb-sep"></span>
            <button type="button" class="tb" data-act="bold" title="Bold (Ctrl+B)"><span data-icon="bold"></span></button>
            <button type="button" class="tb" data-act="italic" title="Italic (Ctrl+I)"><span data-icon="italic"></span></button>
            <span class="tb-wrap">
              <button type="button" class="tb" data-act="underline" title="Underline (Ctrl+U)"><span data-icon="underline"></span></button>
              <button type="button" class="tb tb-caret" data-menu="menu-underline" title="Underline style">▾</button>
              <div class="tb-menu" id="menu-underline" hidden>
                <button type="button" data-ustyle="u-single"><u>Single</u></button>
                <button type="button" data-ustyle="u-double"><span class="u-double">Double</span></button>
                <button type="button" data-ustyle="u-bold"><span class="u-bold">Bold</span></button>
                <button type="button" data-ustyle="u-wavy"><span class="u-wavy">Wavy</span></button>
                <button type="button" data-ustyle="u-dash"><span class="u-dash">Dashed</span></button>
                <button type="button" data-ustyle="none">None</button>
              </div>
            </span>
            <button type="button" class="tb" data-act="strike" title="Strikethrough (Ctrl+Shift+S)"><span data-icon="strike"></span></button>
            <button type="button" class="tb" data-act="code" title="Inline code (Ctrl+E)"><span data-icon="code"></span></button>
            <button type="button" class="tb" data-act="link" title="Link the selected words (or paste a URL over them)"><span data-icon="link"></span></button>
            <button type="button" class="tb" data-act="eq" title="Equation (Ctrl+Q)"><span data-icon="equation"></span></button>
            <span class="tb-sep"></span>
            <button type="button" class="tb" data-act="al" title="Align left"><span data-icon="alignLeft"></span></button>
            <button type="button" class="tb" data-act="ac" title="Align center"><span data-icon="alignCenter"></span></button>
            <button type="button" class="tb" data-act="ar" title="Align right"><span data-icon="alignRight"></span></button>
            <button type="button" class="tb" data-act="aj" title="Justify"><span data-icon="alignJustify"></span></button>
            <span class="tb-sep"></span>
            <!-- Page zoom (0.9.3): the page closer or further, beside the alignment. -->
            <span class="tb-zoom" id="tb-zoom" role="group" aria-label="Page zoom">
              <button type="button" class="tb" data-zoom="out" title="Zoom the page out" aria-label="Zoom the page out">−</button>
              <select class="tb-select tb-zoom-select" id="zoom-select" title="Page zoom" aria-label="Page zoom"></select>
              <button type="button" class="tb" data-zoom="in" title="Zoom the page in" aria-label="Zoom the page in">+</button>
            </span>
            <!-- Auto order page (0.9.3): what a page line falls across goes to the next page. -->
            <button type="button" class="tb tb-order" id="btn-order-page" title="Auto order page — move what a page line falls across to the next page" aria-label="Auto order page"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5h7l3 3v12H5z"/><path d="M7.5 9.5h5M7.5 13h5"/></svg></button>
          </div>
        </div>

        <div class="editor-frame" id="editor-frame">
          <!-- Ctrl+F. Matches are painted with the CSS Custom Highlight API, so
               searching never edits the note. -->
          <div class="find-bar" id="find-bar" hidden>
            <span class="find-ic" data-icon="search"></span>
            <input id="find-input" type="text" placeholder="Find in this note…" autocomplete="off" spellcheck="false" aria-label="Find in this note" />
            <span class="find-count" id="find-count"></span>
            <button type="button" class="find-btn" data-find="prev" title="Previous (Shift+Enter)">↑</button>
            <button type="button" class="find-btn" data-find="next" title="Next (Enter)">↓</button>
            <button type="button" class="find-btn" data-find="close" title="Close (Esc)">✕</button>
          </div>
          <div id="editor" class="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing…  ( / for blocks )"></div>
        </div>
      </div>
    </main>

    <aside class="ai-panel" id="ai-panel" hidden>
      <div class="ai-resize" id="ai-resize" title="Drag to resize"></div>
      <div class="ai-head">
        <div class="ai-tabs" id="ai-tabs" role="tablist"></div>
        <!-- Outside the strip, so they stay in place however far it scrolls (0.9.3):
             load the page again, then + to add a site. -->
        <button type="button" class="btn ghost ai-x ai-reload" id="ai-reload" title="Reload this page" aria-label="Reload this page"><span data-icon="reload"></span></button>
        <button type="button" class="ai-tab ai-add" id="ai-add" title="Add a site" aria-label="Add a site">+</button>
        <button type="button" class="btn ghost ai-x" id="ai-close" title="Close"><span data-icon="close"></span></button>
      </div>
      <div class="ai-body" id="ai-body"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="mini-bar" class="mini-bar" hidden>
    <button type="button" data-act="bold" title="Bold"><span data-icon="bold"></span></button>
    <button type="button" data-act="italic" title="Italic"><span data-icon="italic"></span></button>
    <button type="button" data-act="underline" title="Underline"><span data-icon="underline"></span></button>
    <button type="button" data-act="strike" title="Strikethrough"><span data-icon="strike"></span></button>
    <span class="mb-sep"></span>
    <button type="button" data-act="color" title="Text color"><span class="hl-letter">A</span></button>
    <button type="button" data-act="hilite" title="Highlight"><span class="hl-letter">H</span></button>
    <button type="button" data-act="code" title="Inline code"><span data-icon="code"></span></button>
    <button type="button" data-act="link" title="Link"><span data-icon="link"></span></button>
  </div>

  <div id="shape-bar" class="shape-bar" hidden></div>
  <div id="slash-menu" class="float-menu" hidden></div>

  <!-- Equation editor: LaTeX in, typeset preview above it, Enter to insert. -->
  <div id="eq-pop" class="eq-pop" hidden>
    <div class="eq-preview" id="eq-preview"></div>
    <input id="eq-input" type="text" spellcheck="false" autocomplete="off"
           placeholder="\frac{a}{b}  ·  x^2  ·  \sqrt{n}" aria-label="LaTeX" />
    <div class="eq-actions">
      <span class="eq-hint">LaTeX · Enter inserts · Esc cancels</span>
      <button class="btn ghost" id="eq-cancel" type="button">Cancel</button>
      <button class="btn primary" id="eq-ok" type="button">Insert</button>
    </div>
  </div>

  <div class="update-card" id="update-card" role="status" aria-live="polite" hidden>
    <p class="uc-text" id="uc-text"></p>
    <div class="uc-bar" id="uc-bar" hidden><i id="uc-fill"></i></div>
    <div class="uc-actions">
      <button class="btn ghost" id="uc-dismiss" type="button">Later</button>
      <button class="btn primary" id="uc-action" type="button" hidden></button>
    </div>
  </div>

  <div class="overlay" id="ov-palette" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="palette-input" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <div class="overlay" id="ov-blocks" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="blocks-title">
      <p class="dlg-title" id="blocks-title">Blocks — the / menu</p>
      <div id="blocks-body"></div>
      <div class="dlg-actions">
        <button class="btn ghost" id="blocks-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ov-shortcuts" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="shortcuts-title">
      <p class="dlg-title" id="shortcuts-title">Keyboard shortcuts</p>
      <div id="shortcuts-body"></div>
      <div class="dlg-actions">
        <button class="btn ghost" id="shortcuts-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ov-about" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <p class="dlg-title" id="about-title">About Nebula</p>
      <div id="about-body"></div>
      <div class="dlg-actions" id="about-actions">
        <button class="btn ghost" id="about-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- What changed in this version. Shown once per version on start, and from
       Help -> What's new whenever it is wanted again. -->
  <div class="overlay" id="ov-whats-new" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="whats-new-title">
      <p class="dlg-title" id="whats-new-title">What’s new</p>
      <div id="whats-new-body"></div>
      <div class="dlg-actions">
        <button class="btn primary" id="whats-new-close" type="button">Got it</button>
      </div>
    </div>
  </div>

  <!-- The PDF export's preview (0.9.3): the pages as they will be saved;
       Nebula Wide chooses A4 across or upright. pdf-preview.js -->
  <div class="overlay" id="ov-pdf" hidden>
    <div class="modal modal-pdf" role="dialog" aria-modal="true" aria-labelledby="pdf-title">
      <div class="pdf-head">
        <p class="dlg-title" id="pdf-title">Export as PDF</p>
        <div class="pdf-orient pdf-videos" role="group" aria-label="Videos" hidden>
          <button type="button" data-videos="with" title="Videos as they show in the note: the picture, linked">▶ With videos</button>
          <button type="button" data-videos="without" title="Videos as their links only">Links only</button>
        </div>
        <div class="pdf-orient" data-orient-group role="group" aria-label="Orientation">
          <button type="button" data-orient="landscape"><span class="pdf-sheet pdf-sheet--across" aria-hidden="true"></span>Landscape</button>
          <button type="button" data-orient="portrait"><span class="pdf-sheet pdf-sheet--upright" aria-hidden="true"></span>Portrait</button>
        </div>
        <span class="pdf-paper"></span>
      </div>
      <div class="pdf-frame">
        <p class="pdf-status" role="status"></p>
      </div>
      <div class="dlg-actions">
        <button class="btn ghost" data-pdf="cancel" type="button">Cancel</button>
        <button class="btn primary" data-pdf="export" type="button">Export</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ov-dialog" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <p class="dlg-title" id="dlg-title"></p>
      <input id="dlg-input" type="text" autocomplete="off" />
      <div class="dlg-actions">
        <button class="btn ghost" id="dlg-cancel" type="button">Cancel</button>
        <button class="btn primary" id="dlg-ok" type="button">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
